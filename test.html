<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированный скелет-регулировщик с уникальными траекториями</title>
</head>
<body>
<style>
    :root {
        --car-speed-horizontal: 15s;
        --car-speed-vertical: 15s;
        --pedestrian-speed: 30s;
        --skeleton-transition: 0.8s;
        --car-width-h: 160px;
        --car-width-v: 200px;
        --pedestrian-w: 40px;
        --pedestrian-h: 60px;
    }

    * { box-sizing: border-box; }
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #scene {
        width: 110vw;
        height: 110vh;
        position: relative;
        background: url('media/main.png') no-repeat center 60% / 75%;
        perspective: 1500px;
    }

    /* Hint to browser about animations to reduce painting cost */
    .car-horizontal, .car-vertical, .skeleton, .skeleton2, .pedestrian, .pedestrian-vertical-reverse {
        will-change: transform, opacity;
    }

    /* === МАШИНЫ ГОРИЗОНТАЛЬНЫЕ === */
    .car-horizontal {
        position: absolute;
        width: var(--car-width-h);
        z-index: 10;
    }

    .car-horizontal.left-to-right {
        animation: drive-lr var(--car-speed-horizontal) linear infinite;
    }

    .car-horizontal.right-to-left {
        animation: drive-rl var(--car-speed-horizontal) linear infinite;
        transform: scaleX(-1);
    }

    .car-horizontal.paused,
    .car-vertical.paused,
    .pedestrian.paused,
    .skeleton.paused,
    .skeleton2.paused,
    .pedestrian-vertical.paused,
    .pedestrian-horizontal.paused {
        animation-play-state: paused !important;
    }

    .car-horizontal .car-body {
        width: 100%;
        position: relative;
        bottom: 10px;
    }

    .car-horizontal .wheel {
        position: absolute;
        width: 18%;
        animation: rotate-wheel 0.5s linear infinite;
    }

    .car-horizontal .front-wheel { bottom: 5%; right: 10%; }
    .car-horizontal .back-wheel { bottom: 5%; left: 11%; }

    @keyframes drive-lr {
        from { transform: translateX(calc(100vw + 220px)); }
        to { transform: translateX(-220px); }
    }

    @keyframes drive-rl {
        from { transform: translateX(-220px) scaleX(-1); }
        to { transform: translateX(calc(100vw + 220px)) scaleX(-1); }
    }

    @keyframes rotate-wheel {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
    }

    /* === МАШИНЫ ВЕРТИКАЛЬНЫЕ === */
    .car-vertical {
        position: absolute;
        width: var(--car-width-v);
        z-index: 5;
    }

    .car-vertical img {
        width: 100%;
        height: auto;
    }

    .car-vertical.bottom-to-top {
        animation: drive-tb var(--car-speed-vertical) linear infinite;
    }

    .car-vertical.top-to-bottom {
        animation: drive-bt var(--car-speed-vertical) linear infinite;
    }

    @keyframes drive-bt {
        from { transform: translate(30vw, 85vh) scale(1.2); }
        to { transform: translate(50vw, -5vh) scale(0.05); }
    }
    @keyframes drive-tb {
        from { transform: translate(43vw, -7vh) scale(0.05); }
        to { transform: translate(50vw, 85vh) scale(1.2); }
    }

    .car-vertical-unique-tb {
        animation: drive-unique-tb var(--car-speed-vertical) linear infinite;
    }
    @keyframes drive-unique-tb {
        0% { transform: translate(39vw, -7vh) scale(0.05) ; }
        40% { transform: translate(49vw, 30vh) scale(0.5) ; }
        70% { transform: translate(56vw, 60vh) scale(0.8) ; }
        100% { transform: translate(60vw, 75vh) scale(1.2) ; }
    }

    .car-vertical-unique-bt {
        animation: drive-unique-bt var(--car-speed-vertical) linear infinite;
    }
    @keyframes drive-unique-bt {
        0% { transform: translate(33vw, 85vh) scale(1.2) ; }
        40% { transform: translate(35vw, 45vh) scale(0.8) ; }
        70% { transform: translate(38vw, 15vh) scale(0.2) ; }
        100% { transform: translate(40vw, -5vh) scale(0.05) ; }
    }

    /* === ПЕШЕХОДЫ === */
    .pedestrian {
        position: absolute;
        width: var(--pedestrian-w);
        height: var(--pedestrian-h);
        z-index: 15;
        transform-origin: center bottom;
    }
    .skeleton, .skeleton2 {
        z-index: 100;
        transform-style: preserve-3d;
        position: absolute;
    }

    .pedestrian-horizontal {
        animation: walk-horizontal var(--pedestrian-speed) linear infinite;
        top: 32%;
    }

    .pedestrian-vertical {
        position: absolute;
        width: var(--pedestrian-w);
        height: var(--pedestrian-h);
        z-index: 6;
    }


    .skeleton .head, .skeleton2 .head { transform-origin: center center; }
    .skeleton .arm.left, .skeleton .arm.right,
    .skeleton2 .arm.left, .skeleton2 .arm.right { transform-origin: center top; }

    /* Пешеход (визуальные стили) */
    .pedestrian::before {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        background: #ff6b6b;
        border-radius: 50%;
        top: 0;
        left: 10px;
    }

    .pedestrian::after {
        content: '';
        position: absolute;
        width: 16px;
        height: 30px;
        background: #4ecdc4;
        top: 22px;
        left: 12px;
        border-radius: 5px;
    }

    .pedestrian-vertical-reverse {
        position: absolute;
        width: var(--pedestrian-w);
        height: var(--pedestrian-h);
        z-index: 4;
        transform-origin: center bottom;
        /* используем те же keyframes, но проигрываем в обратную сторону */
        animation: walk-vertical var(--pedestrian-speed) linear infinite;
        animation-direction: reverse;
    }

    .pedestrian-vertical-reverse-unique {
        animation: walk-vertical-unique var(--pedestrian-speed) linear infinite;
        animation-direction: reverse;
    }

    @keyframes walk-vertical-reverse {
        0% { transform: translate(50vw, 100vh) scale(0.12); }
        100% { transform: translate(50vw, -10vh) scale(0.02); }
    }

    @keyframes walk-horizontal {
        from { transform: translateX(-60px) scale(0.05); }
        to { transform: translateX(calc(90vw + 60px)) scale(0.07); }
    }

    @keyframes walk-vertical {
        from { transform: translate(40vw, 0vh) scale(0.02); }
        to { transform: translate(90vw, 100vh) scale(0.12); }
    }

    .pedestrian-vertical-unique {
        animation: walk-vertical-unique var(--pedestrian-speed) linear infinite;
    }

    @keyframes walk-vertical-unique {
        0% { transform: translate(51vw, 0vh) scale(0.01); }
        30% { transform: translate(35vw, 25vh) scale(0.05); }
        60% { transform: translate(23vw, 60vh) scale(0.08); }
        100% { transform: translate(8vw, 105vh) scale(0.12); }
    }

    .pedestrian-horizontal-unique {
        animation: walk-horizontal-unique var(--pedestrian-speed) linear infinite;
    }

    @keyframes walk-horizontal-unique {
        0% { transform: translateX(-60px) translateY(12vh) scale(0.05); }
        30% { transform: translateX(30vw) translateY(12vh) scale(0.05); }
        60% { transform: translateX(60vw) translateY(12vh) scale(0.05); }
        100% { transform: translateX(calc(100vw + 60px)) translateY(12vh) scale(0.05); }
    }

    /* ВТОРИЧНЫЕ СТИЛИ СКЕЛЕТА (голова по умолчанию над туловищем) */
    .head {
        position: absolute;
        top: 100px;
        left: 270px;
        width: 327px;
        height: 496px;
        background: url('media/golova.png') no-repeat center / contain;
        z-index: 10; /* по умолчанию голова выше туловища */
    }

    .torso {
        position: absolute;
        top: 400px;
        left: 60px;
        width: 737px;
        height: 837px;
        background: url('media/telo.png') no-repeat center / contain;
        transform-origin: top center;
        z-index: 5; /* туловище ниже по умолчанию */
    }

    /* Для пешеходов, которые идут СНИЗУ→ВВЕРХ, голова должна быть под туловищем */
    .pedestrian-vertical-reverse .head,
    .pedestrian-vertical-reverse-unique .head {
        z-index: 5;
    }
    .pedestrian-vertical-reverse .torso,
    .pedestrian-vertical-reverse-unique .torso {
        z-index: 10;
    }

    .arm { position: absolute; }
    .arm.left { top: 600px; left: 600px; }
    .arm.right { top: 600px; left: 45px; }

    .upper-arm {
        position: relative;
        transform-origin: top center;
        background-size: contain;
        background-repeat: no-repeat;
    }

    .upper-arm.left {
        width: 205px;
        height: 444px;
        background-image: url('media/levruka1.png');
    }

    .upper-arm.right {
        width: 204px;
        height: 458px;
        background-image: url('media/pravruka1.png');
    }

    .forearm {
        position: absolute;
        transform-origin: top center;
        background-size: contain;
        background-repeat: no-repeat;
        z-index: 20;
    }

    .forearm.left {
        top: 344px;
        left: 0;
        width: 164px;
        height: 382px;
        background-image: url('media/levruka2.png');
    }

    .forearm.right {
        top: 318px;
        left: 0;
        width: 163px;
        height: 386px;
        background-image: url('media/pravruka2.png');
    }

    .hand {
        position: absolute;
        transform-origin: top center;
        background-size: contain;
        background-repeat: no-repeat;
    }

    .hand.left {
        top: 360px;
        left: 50px;
        width: 108px;
        height: 194px;
        background-image: url('media/levruka3.png');
    }

    .hand.right {
        top: 350px;
        left: 0;
        width: 108px;
        height: 194px;
        background-image: url('media/pravruka3.png');
    }

    .legs-container {
        position: absolute;
        top: 1130px;
        left: 210px;
        width: 433px;
        height: 752px;
    }

    .legs-container img {
        width: 100%;
        height: auto;
        display: block;
    }

    /* === КНОПКИ УПРАВЛЕНИЯ === */
    #scenarios-controls {
        position: absolute;
        right: 1300px;
        bottom: 60px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        pointer-events: auto;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #scenarios-controls button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: #fff;
        padding: 14px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        text-align: left;
        min-width: 220px;
    }

    #scenarios-controls button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    #scenarios-controls button:active {
        transform: translateY(0);
    }

    #scenarios-controls button.active {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        box-shadow: 0 4px 15px rgba(245, 87, 108, 0.6);
    }

    .button-label {
        display: block;
        font-size: 12px;
        opacity: 0.8;
        margin-top: 4px;
        font-weight: 400;
    }

    #active-scenario {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 15px 25px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        z-index: 9998;
        backdrop-filter: blur(10px);
    }

    /* Специфические стили для поворачивающей машины */
    .special-turn-container { position: absolute; display: none; z-index: 12; width:180px; height:120px; pointer-events:none; }
    .special-turn-container img { width: 100%; display: block; }

    /* Колёса: присутствуют в всех видах, но opacity управляется JS */
    .view-side .wheel, .view-front .wheel, .view-rotate .wheel {
        width:33px; position:absolute; top:39px; opacity:0; z-index:30; transition: opacity 160ms linear;
    }
    .view-side .wheel.front, .view-front .wheel.front, .view-rotate .wheel.front { left:130px; }
    .view-side .wheel.back, .view-front .wheel.back, .view-rotate .wheel.back { left:20px; }

    @keyframes spin-slow { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
    .spinning { animation: spin-slow 0.8s linear infinite; }

    .h-wrapper { position: relative; width: var(--car-width-h); }
    .h-wrapper .wheel { position: absolute; width: 18%; animation: rotate-wheel 0.5s linear infinite; }
    .h-wrapper .front-wheel { bottom: -13%; right: 10%; }
    .h-wrapper .back-wheel { bottom: -13%; left: 11%; }

    .path-L2C { top: 23%; animation: anim-L2C 5s linear forwards; }
    @keyframes anim-L2C { from { transform: translateX(-220px); } to { transform: translateX(calc(50vw - 80px)); } }
    .path-C2D { animation: anim-C2D 10s linear forwards; }
    @keyframes anim-C2D { from { transform: translate(15vw, 0vh) scale(0.2); } to { transform: translate(-25vw, 150vh) scale(0.25); } }

    .hidden { display: none !important; }
    .view-side, .view-rotate, .view-front { position:absolute; top:0; left:0; opacity:0; transition: opacity .25s ease; }
    .view-side:not(.hidden), .view-rotate:not(.hidden), .view-front:not(.hidden) { opacity:1; }

    /* Controls panel styles */
    #rev-controls {
        position: fixed;
        right: 20px;
        top: 20px;
        z-index: 10000;
        background: rgba(0,0,0,0.75);
        color: #fff;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        width: 280px;
        box-shadow: 0 6px 30px rgba(0,0,0,0.6);
        max-height: 85vh;
        overflow: auto;
    }
    #rev-controls label { display:block; margin-top:8px; font-size:12px; opacity:0.95; }
    #rev-controls input[type="range"] { width: 100%; margin-top:4px; }
    #rev-controls .controls-row { display:flex; gap:8px; margin-top:8px; }
    #rev-controls button { padding:8px; border-radius:6px; border: none; cursor:pointer; background: #3b82f6; color:white; font-weight:600; }
    #rev-controls button.secondary { background:#10b981; }
    #rev-controls .small { font-size:11px; opacity:0.8; margin-top:8px; }
</style>

    <!-- Trajectory controls for reverse car -->
    <div id="rev-controls" aria-hidden="false">
        <div style="font-weight:700; margin-bottom:6px;">Настройка траектории реверса</div>

        <input id="inp-upY" type="range" min="50" max="900" value="350">

        <label>arcControlY <span id="lbl-arcY">100</span></label>
        <input id="inp-arcY" type="range" min="10" max="400" value="100">

        <label>arcDeltaX <span id="lbl-arcX">220</span></label>
        <input id="inp-arcX" type="range" min="20" max="600" value="220">

        <label>arcStep <span id="lbl-step">0.012</span></label>
        <input id="inp-step" type="range" min="0.004" max="0.03" step="0.001" value="0.012">

            <button id="btn-randomize-rev" class="secondary">Случай</button>

<script>
    /* Исправленный JS — гарантированный полный сброс состояния поворачивающихся машин перед каждым стартом.
       Вставляйте этот скрипт вместо вашего старого <script>.
    */

    // ---- Utilities ----
    function clearAnimationRecursively(root) {
        if (!root) return;
        const nodes = [root, ...Array.from(root.querySelectorAll('*'))];
        nodes.forEach(n => {
            try { n.style.animation = 'none'; n.style.transition = ''; } catch (e) {}
        });
        // force reflow to clear animation progress
        void root.offsetWidth;
        // allow future animations to be added anew
        nodes.forEach(n => {
            try { n.style.animation = ''; } catch (e) {}
        });
    }

    // Async reset that ensures browser applied style changes before resolving
    function resetTurningCarStateAsync(carEl, views = [], wheels = [], startX, startY) {
        return new Promise(resolve => {
            if (!carEl) return resolve();
            carEl.classList.remove('path-L2C','path-C2D','path-B2C','path-C2R');

            clearAnimationRecursively(carEl);

            (views || []).forEach(v => v.classList.add('hidden'));
            (wheels || []).forEach(w => { w.style.opacity = '0'; w.classList.remove('spinning'); w.style.transform = 'none'; });

            if (typeof startX === 'number') carEl.style.left = startX + 'px';
            if (typeof startY === 'number') carEl.style.top = startY + 'px';
            carEl.style.transform = '';
            carEl.style.right = '';
            carEl.style.display = 'none';
            carEl.style.opacity = '1';

            // wait one frame to be safe (ensure styles applied)
            requestAnimationFrame(() => setTimeout(resolve, 16));
        });
    }

    // ---- Cache DOM ----
    const carsHorizontal = Array.from(document.querySelectorAll('.car-horizontal'));
    const carsVertical = Array.from(document.querySelectorAll('.car-vertical'));
    const pedestriansH = Array.from(document.querySelectorAll('.pedestrian-horizontal'));
    const pedestriansV = Array.from(document.querySelectorAll('.pedestrian-vertical'));
    const pedestriansUniqueH = Array.from(document.querySelectorAll('.pedestrian-horizontal-unique'));
    const pedestriansUniqueV = Array.from(document.querySelectorAll('.pedestrian-vertical-unique'));
    const pedestriansReverse = Array.from(document.querySelectorAll('.pedestrian-vertical-reverse, .pedestrian-vertical-reverse-unique'));
    const skeletonsAll = Array.from(document.querySelectorAll('.skeleton, .skeleton2'));
    const buttons = Array.from(document.querySelectorAll('#scenarios-controls button'));
    const activeScenarioLabel = document.getElementById('active-scenario');

    const turningCar = document.getElementById('yogurt-turning-car');
    const mainSide = turningCar.querySelector('.view-side');
    const mainRotate = turningCar.querySelector('.view-rotate');
    const mainFront = turningCar.querySelector('.view-front');
    const mainWheels = Array.from(turningCar.querySelectorAll('.wheel'));

    const turningCarReverse = document.getElementById('yogurt-turning-car-reverse');
    const revFront = turningCarReverse.querySelector('.view-front');
    const revRotate = turningCarReverse.querySelector('.view-rotate');
    const revSide = turningCarReverse.querySelector('.view-side');
    const revWheels = Array.from(turningCarReverse.querySelectorAll('.wheel'));

    const allAnimatedElements = [
        ...carsHorizontal, ...carsVertical,
        ...pedestriansH, ...pedestriansV,
        ...pedestriansUniqueH, ...pedestriansUniqueV,
        ...pedestriansReverse
    ];

    // store top for horizontal filtering
    carsHorizontal.forEach(car => {
        const topVal = car.style.top ? parseFloat(car.style.top) : NaN;
        car.dataset.topPercent = isNaN(topVal) ? 1000 : topVal;
    });

    // pedestrians parallax data
    const pedestriansData = [...pedestriansH, ...pedestriansUniqueH].map(ped => {
        const left = ped.style.left ? parseFloat(ped.style.left) : Math.random() * 90;
        const top = ped.style.top ? parseFloat(ped.style.top) : 100 + Math.random() * 50;
        const speed = Math.random() * 0.03 + 0.02;
        return { el: ped, left, top, speed };
    });

    // initial setup for some elements
    [...pedestriansV, ...pedestriansUniqueV].forEach(p => { p.style.transform = 'translate(53vw, -5vh) scale(0.05)'; p.style.opacity = 0; p.classList.add('paused'); });
    pedestriansReverse.forEach(p => { p.style.transform = 'translate(50vw, 100vh) scale(0.12)'; p.style.opacity = 0; p.classList.add('paused'); });
    carsHorizontal.forEach(c => { c.style.transform = 'translateX(-10vw) scale(0.05)'; c.style.opacity = 0; c.classList.add('paused'); });
    carsVertical.forEach(c => { c.style.transform = 'translateY(-10vh) scale(0.05)'; c.style.opacity = 0; c.classList.add('paused'); });

    function showWheels(wheels, show) {
        wheels.forEach(w => {
            w.style.opacity = show ? '1' : '0';
            if (show) w.classList.add('spinning'); else w.classList.remove('spinning');
        });
    }

    // ---- MAIN arc (right -> center -> arc down -> down) ----
    let mainRAF = null, mainCycleTimeout = null;
    let mainCancelled = false;
    const mainParams = {
        startXOffset: 420,
        startY: Math.round(window.innerHeight * 0.35),
        moveLeftSpeed: 1.8,
        centerX: Math.round(window.innerWidth * 0.5),
        arcControlX: 80,
        arcDeltaY: 200,
        arcStep: 0.01,
        moveDownSpeed: 1.6,
        exitPadding: 200,
        pauseBetweenCycles: 600
    };

    function showMainFrame(which) {
        mainSide.classList.add('hidden');
        mainRotate.classList.add('hidden');
        mainFront.classList.add('hidden');

        if (which === 'side') mainSide.classList.remove('hidden');
        if (which === 'turn') mainRotate.classList.remove('hidden');
        if (which === 'front') mainFront.classList.remove('hidden');

        // Per request: do NOT show wheels in front/top->down view
        showWheels(mainWheels, which === 'side' || which === 'turn');

        // main side should face LEFT; if asset faces right, change to -1
        const img = mainSide.querySelector('img'); if (img) img.style.transform = 'scaleX(1)';
    }

    function stopMainArc() {
        mainCancelled = true;
        if (mainRAF) { cancelAnimationFrame(mainRAF); mainRAF = null; }
        if (mainCycleTimeout) { clearTimeout(mainCycleTimeout); mainCycleTimeout = null; }
        if (!turningCar) return;
        turningCar.style.display = 'none';
        [mainSide, mainRotate, mainFront].forEach(v => v.classList.add('hidden'));
        showWheels(mainWheels, false);
        const startX = window.innerWidth + mainParams.startXOffset;
        const startY = mainParams.startY;
        // synchronous reset OK here (we also use async reset before start)
        resetTurningCarStateAsync(turningCar, [mainSide, mainRotate, mainFront], mainWheels, startX, startY);
    }

    async function startMainArc() {
        if (!turningCar) return;
        stopMainArc();

        const startX = window.innerWidth + mainParams.startXOffset;
        const startY = mainParams.startY;
        // wait for a guaranteed reset
        await resetTurningCarStateAsync(turningCar, [mainSide, mainRotate, mainFront], mainWheels, startX, startY);

        mainCancelled = false;
        turningCar.style.display = 'block';
        turningCar.style.left = startX + 'px';
        turningCar.style.top = startY + 'px';
        turningCar.style.opacity = '1';
        turningCar.style.transition = '';

        showMainFrame('side');

        let x = startX, y = startY;

        function moveLeft() {
            if (mainCancelled) return;
            x -= mainParams.moveLeftSpeed;
            turningCar.style.left = x + 'px';
            showMainFrame('side');

            if (x > mainParams.centerX + 40) {
                mainRAF = requestAnimationFrame(moveLeft);
            } else {
                startArc(x, y);
            }
        }

        function startArc(px, py) {
            let t = 0;
            const p0 = { x: px, y: py };
            const p1 = { x: px - mainParams.arcControlX, y: py + mainParams.arcDeltaY * 0.45 };
            const p2 = { x: px - mainParams.arcControlX * 1.1, y: py + mainParams.arcDeltaY };

            function arcStep() {
                if (mainCancelled) return;
                t = Math.min(1, t + mainParams.arcStep);
                const nx = Math.pow(1 - t, 2) * p0.x + 2 * (1 - t) * t * p1.x + Math.pow(t, 2) * p2.x;
                const ny = Math.pow(1 - t, 2) * p0.y + 2 * (1 - t) * t * p1.y + Math.pow(t, 2) * p2.y;
                turningCar.style.left = nx + 'px';
                turningCar.style.top = ny + 'px';

                if (t < 0.25) showMainFrame('side');
                else if (t < 0.8) showMainFrame('turn');
                else showMainFrame('front');

                if (t < 1) mainRAF = requestAnimationFrame(arcStep);
                else moveDown(nx, ny);
            }
            mainRAF = requestAnimationFrame(arcStep);
        }

        // ЗАМЕНА: при выходе — полностью остановить и перезапустить цикл (сброс локальных x/y)
        function moveDown(currX, currY) {
            let posX = currX, posY = currY;
            function stepDown() {
                if (mainCancelled) return;
                posY += mainParams.moveDownSpeed;
                posX -= 0.2;
                turningCar.style.left = posX + 'px';
                turningCar.style.top = posY + 'px';
                showMainFrame('front');

                if (posY < window.innerHeight + mainParams.exitPadding) {
                    mainRAF = requestAnimationFrame(stepDown);
                } else {
                    turningCar.style.transition = 'opacity 220ms';
                    turningCar.style.opacity = '0';

                    mainCycleTimeout = setTimeout(() => {
                        // КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ:
                        // Полный стоп и рестарт для сброса координат x и y в замыкании
                        stopMainArc();
                        // Небольшая задержка, чтобы стоп успел очистить всё
                        setTimeout(() => {
                            startMainArc();
                        }, 16);
                    }, 240);
                }
            }
            mainRAF = requestAnimationFrame(stepDown);
        }

        mainRAF = requestAnimationFrame(moveLeft);
    }

    // ---- REVERSE arc (bottom -> up -> arc right -> right) ----
    let revRAF = null, revCycleTimeout = null;
    let revCancelled = false;
    const revParams = {
        startXOffsetFromRight: 420,
        startYOffset: 60,
        upTargetY: Math.round(window.innerHeight * 0.45),
        speedUp: 1.8,
        arcControlY: 100,
        arcDeltaX: 220,
        arcStep: 0.012,
        speedRight: 1.8,
        exitPadding: 200,
        pauseBetweenCycles: 500
    };

    function showRevFrame(which) {
        revFront.classList.add('hidden');
        revRotate.classList.add('hidden');
        revSide.classList.add('hidden');
        if (which === 'front') revFront.classList.remove('hidden');
        if (which === 'turn') revRotate.classList.remove('hidden');
        if (which === 'side') revSide.classList.remove('hidden');

        showWheels(revWheels, which === 'side');

        if (which === 'side') {
            const img = revSide.querySelector('img');
            if (img) img.style.transform = 'scaleX(-1)'; // reverse faces right
            revWheels.forEach(w => w.style.transform = 'scaleX(-1)');
        } else {
            const img = revSide.querySelector('img');
            if (img) img.style.transform = 'none';
            revWheels.forEach(w => w.style.transform = 'none');
        }
    }

    function stopReverseThreePhase() {
        revCancelled = true;
        if (revRAF) { cancelAnimationFrame(revRAF); revRAF = null; }
        if (revCycleTimeout) { clearTimeout(revCycleTimeout); revCycleTimeout = null; }
        if (!turningCarReverse) return;
        turningCarReverse.style.display = 'none';
        [revFront, revRotate, revSide].forEach(v => v.classList.add('hidden'));
        showWheels(revWheels, false);
        const startX = Math.max(window.innerWidth - revParams.startXOffsetFromRight, 300);
        const startY = window.innerHeight + revParams.startYOffset;
        resetTurningCarStateAsync(turningCarReverse, [revFront, revRotate, revSide], revWheels, startX, startY);
    }

    async function startReverseThreePhase() {
        if (!turningCarReverse) return;
        stopReverseThreePhase();

        const startX = Math.max(window.innerWidth - revParams.startXOffsetFromRight, 300);
        const startY = window.innerHeight + revParams.startYOffset;
        await resetTurningCarStateAsync(turningCarReverse, [revFront, revRotate, revSide], revWheels, startX, startY);

        revCancelled = false;
        turningCarReverse.style.display = 'block';
        turningCarReverse.style.left = startX + 'px';
        turningCarReverse.style.top = startY + 'px';
        turningCarReverse.style.opacity = '1';
        turningCarReverse.style.transition = '';

        showRevFrame('front');
        showWheels(revWheels, false);

        let x = startX, y = startY;

        function moveUp() {
            if (revCancelled) return;
            y -= revParams.speedUp;
            turningCarReverse.style.top = y + 'px';
            if (y > revParams.upTargetY) revRAF = requestAnimationFrame(moveUp);
            else startArc();
        }

        function startArc() {
            let t = 0;
            const p0 = { x: x, y: y };
            const p1 = { x: x, y: y - revParams.arcControlY };
            const p2 = { x: x + revParams.arcDeltaX, y: y - revParams.arcControlY };

            function arcStep() {
                if (revCancelled) return;
                t = Math.min(1, t + revParams.arcStep);
                const nx = Math.pow(1 - t, 2) * p0.x + 2 * (1 - t) * t * p1.x + Math.pow(t, 2) * p2.x;
                const ny = Math.pow(1 - t, 2) * p0.y + 2 * (1 - t) * t * p1.y + Math.pow(t, 2) * p2.y;
                turningCarReverse.style.left = nx + 'px';
                turningCarReverse.style.top = ny + 'px';

                if (t > 0.2 && t < 0.8) showRevFrame('turn');
                else if (t >= 0.8) showRevFrame('side');
                else showRevFrame('front');

                if (t < 1) revRAF = requestAnimationFrame(arcStep);
                else moveRight(nx, ny);
            }
            revRAF = requestAnimationFrame(arcStep);
        }

        // ЗАМЕНА: при выходе — полностью остановить и перезапустить цикл (сброс локальных x/y)
        function moveRight(currX, currY) {
            let posX = currX, posY = currY;
            function stepRight() {
                if (revCancelled) return;
                posX += revParams.speedRight;
                turningCarReverse.style.left = posX + 'px';
                showRevFrame('side');

                if (posX < window.innerWidth + revParams.exitPadding) {
                    revRAF = requestAnimationFrame(stepRight);
                } else {
                    turningCarReverse.style.transition = 'opacity 200ms';
                    turningCarReverse.style.opacity = '0';

                    revCycleTimeout = setTimeout(() => {
                        // КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ:
                        // Полный стоп и рестарт для сброса координат x и y в замыкании
                        stopReverseThreePhase();
                        setTimeout(() => {
                            startReverseThreePhase();
                        }, 16);
                    }, 200);
                }
            }
            revRAF = requestAnimationFrame(stepRight);
        }

        revRAF = requestAnimationFrame(moveUp);
    }

    // ---- Trajectory controls binding (init) ----
    (function initRevControls() {
        const panel = document.getElementById('rev-controls');
        if (!panel) return;

        const map = {
            startX: ['inp-startX', 'lbl-startX', v => { revParams.startXOffsetFromRight = Number(v); }],
            startY: ['inp-startY', 'lbl-startY', v => { revParams.startYOffset = Number(v); }],
            upY:    ['inp-upY',    'lbl-upY',    v => { revParams.upTargetY = Number(v); }],
            arcY:   ['inp-arcY',   'lbl-arcY',   v => { revParams.arcControlY = Number(v); }],
            arcX:   ['inp-arcX',   'lbl-arcX',   v => { revParams.arcDeltaX = Number(v); }],
            step:   ['inp-step',   'lbl-step',   v => { revParams.arcStep = Number(v); }],
            upSpd:  ['inp-upSpd',  'lbl-upSpd',  v => { revParams.speedUp = Number(v); }],
            rightSpd:['inp-rightSpd','lbl-rightSpd', v => { revParams.speedRight = Number(v); }]
        };

        Object.keys(map).forEach(k => {
            const [inpId, lblId, applyFn] = map[k];
            const inp = document.getElementById(inpId);
            const lbl = document.getElementById(lblId);
            if (!inp || !lbl) return;
            const updateLabel = v => {
                // keep step displayed with 3 decimals if needed
                if (inp.step && parseFloat(inp.step) < 1) lbl.textContent = parseFloat(v).toFixed(3);
                else lbl.textContent = v;
            };
            updateLabel(inp.value);
            inp.addEventListener('input', (e) => updateLabel(e.target.value));
            inp.addEventListener('change', (e) => applyFn(e.target.value));
        });

        document.getElementById('btn-apply-rev').addEventListener('click', () => {
            // apply all current input values to revParams
            Object.keys(map).forEach(k => {
                const [inpId, , applyFn] = map[k];
                const inp = document.getElementById(inpId);
                if (!inp) return;
                applyFn(inp.value);
            });
            // restart reverse animation to pick up new params
            stopReverseThreePhase();
            setTimeout(() => startReverseThreePhase(), 30);
        });

        document.getElementById('btn-randomize-rev').addEventListener('click', () => {
            const rand = (min,max,step=1) => Math.round((Math.random()*(max-min)+min)/step)*step;
            const sx = rand(200,700,10);
            const sy = rand(0,200,5);
            const uy = rand(120,Math.max(150, Math.round(window.innerHeight*0.6)),5);
            const aY = rand(40,280,5);
            const aX = rand(80,500,10);
            const st = +(Math.random()*0.02 + 0.006).toFixed(3);
            const su = +(Math.random()*4 + 0.6).toFixed(2);
            const sr = +(Math.random()*5 + 0.6).toFixed(2);

            document.getElementById('inp-startX').value = sx; document.getElementById('lbl-startX').textContent = sx;
            document.getElementById('inp-startY').value = sy; document.getElementById('lbl-startY').textContent = sy;
            document.getElementById('inp-upY').value = uy;   document.getElementById('lbl-upY').textContent = uy;
            document.getElementById('inp-arcY').value = aY;  document.getElementById('lbl-arcY').textContent = aY;
            document.getElementById('inp-arcX').value = aX;  document.getElementById('lbl-arcX').textContent = aX;
            document.getElementById('inp-step').value = st;  document.getElementById('lbl-step').textContent = st;
            document.getElementById('inp-upSpd').value = su; document.getElementById('lbl-upSpd').textContent = su;
            document.getElementById('inp-rightSpd').value = sr; document.getElementById('lbl-rightSpd').textContent = sr;

            // apply and restart
            document.getElementById('btn-apply-rev').click();
        });
    })();

    // ---- legs / arms / pedestrians ----
    const legFrames = ['media/nogi1.png','media/nogi2.png','media/nogi3.png'];
    let legFrame = 0;
    let legTimer = 0;
    const skeletonLegImgs = Array.from(document.querySelectorAll('.legs-container img'));

    function animateLegs(delta) {
        legTimer += delta;
        if (legTimer > 0.3) {
            legFrame = (legFrame + 1) % legFrames.length;
            const src = legFrames[legFrame];
            skeletonLegImgs.forEach(img => { try { if (img && img.src.indexOf(src) === -1) img.src = src; } catch(e) {} });
            legTimer = 0;
        }
    }

    function animateArmsForAll(time) {
        const scaleBase = 1 + Math.sin(time * 0.005) * 0.02;
        document.querySelectorAll('.skeleton, .skeleton2').forEach(sk => {
            const armL = sk.querySelector('.arm.left');
            const armR = sk.querySelector('.arm.right');
            if (armL) armL.style.transform = `scaleY(${scaleBase})`;
            if (armR) armR.style.transform = `scaleY(${scaleBase})`;
        });
    }

    function animatePedestrianHorizontalMovement(time) {
        for (let i = 0; i < pedestriansData.length; i++) {
            const p = pedestriansData[i];
            let top = p.top - p.speed;
            if (top < -110) top = 110;
            p.top = top;
            const scalePed = 0.07 + (1 - top / 100) * 0.05;
            p.el.style.transform = `translateX(${p.left}vw) translateY(${top}vh) scale(${scalePed})`;
        }
    }

    function hardResetAnimations() {
        const animations = allAnimatedElements.map(el => getComputedStyle(el).animation);
        requestAnimationFrame(() => {
            allAnimatedElements.forEach(el => el.style.animation = 'none');
            requestAnimationFrame(() => allAnimatedElements.forEach((el, i) => el.style.animation = animations[i] || ''));
        });
    }

    // ---- scenarios ----
    const scenarios = {
        1: {name:'Руки в стороны', horizontalCars:'top-only', verticalCars:'stop', pedestriansH:'unique-only', pedestriansV:'stop'},
        2: {name:'Правая рука вперед', horizontalCars:'go', verticalCars:'stop', pedestriansH:'stop', pedestriansV:'go'},
        3: {name:'Рука вверх', horizontalCars:'stop', verticalCars:'stop', pedestriansH:'stop', pedestriansV:'stop'},
        4: {name:'Свободный режим', horizontalCars:'stop', verticalCars:'go', pedestriansH:'stop', pedestriansV:'go'}
    };

    function setElementsState(elems, running) {
        for (let i = 0; i < elems.length; i++) {
            const el = elems[i];
            if (running) {
                el.classList.remove('paused');
                el.style.animationPlayState = 'running';
                el.style.display = 'block';
                el.style.opacity = '1';
            } else {
                el.classList.add('paused');
                el.style.animationPlayState = 'paused';
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
    }

    function applyScenario(n) {
        buttons.forEach(btn => btn.classList.remove('active'));
        document.querySelector(`[data-gesture="${n}"]`)?.classList.add('active');
        activeScenarioLabel.textContent = `Сценарий: ${scenarios[n].name}`;

        // ensure sequences are fully reset before applying
        stopMainArc();
        stopReverseThreePhase();
        hardResetAnimations();

        setTimeout(() => {
            if (scenarios[n].horizontalCars === 'go') setElementsState(carsHorizontal, true);
            else if (scenarios[n].horizontalCars === 'top-only') {
                carsHorizontal.forEach(car => {
                    const t = parseFloat(car.dataset.topPercent || 1000);
                    setElementsState([car], t <= 25);
                });
            } else setElementsState(carsHorizontal, false);

            setElementsState(carsVertical, scenarios[n].verticalCars === 'go');

            if (scenarios[n].pedestriansH === 'go' || scenarios[n].pedestriansH === 'all') {
                setElementsState(pedestriansH, true); setElementsState(pedestriansUniqueH, true);
            } else if (scenarios[n].pedestriansH === 'unique-only') {
                setElementsState(pedestriansUniqueH, true);
                const normalH = pedestriansH.filter(el => !el.classList.contains('pedestrian-horizontal-unique'));
                setElementsState(normalH, false);
            } else {
                setElementsState(pedestriansH, false); setElementsState(pedestriansUniqueH, false);
            }

            const isVertGo = scenarios[n].pedestriansV === 'go';
            setElementsState(pedestriansV, isVertGo);
            setElementsState(pedestriansUniqueV, isVertGo);
            setElementsState(pedestriansReverse, isVertGo);

            if (n == 1) {
                startMainArc();
                startReverseThreePhase();
            }
        }, 50);
    }

    buttons.forEach(btn => btn.addEventListener('click', () => applyScenario(parseInt(btn.dataset.gesture, 10))));

    // main loop
    let lastTime = performance.now();
    function animate(time) {
        const delta = (time - lastTime) / 1000 || 0;
        lastTime = time;

        animateLegs(delta);
        animateArmsForAll(time);
        animatePedestrianHorizontalMovement(time);

        for (let i = 0; i < skeletonsAll.length; i++) {
            const sk = skeletonsAll[i];
            const head = sk.querySelector('.head');
            if (head) head.style.transform = `rotate(${Math.sin(time * 0.003) * 5}deg)`;
        }

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // start default
    applyScenario(1);

    // on resize update params
    window.addEventListener('resize', () => {
        mainParams.centerX = Math.round(window.innerWidth * 0.5);
        mainParams.startY = Math.round(window.innerHeight * 0.35);
        revParams.upTargetY = Math.round(window.innerHeight * 0.45);
    });

</script>
</body>
</html>
